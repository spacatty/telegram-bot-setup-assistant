<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tgsa · Telegram bot setup</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%232AABEE'/><path d='M8 15.5l14-5.5-2.5 12-4-3-2 2-.5-3.5 6-5.5-7.5 4.5z' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--accent)"/><path d="M8 15.5l14-5.5-2.5 12-4-3-2 2-.5-3.5 6-5.5-7.5 4.5z" fill="#fff"/></svg>
      <div>
        <b>tgsa</b>
        <span>Telegram bot setup assistant</span>
      </div>
    </div>
    <form id="add-form" class="paste" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a5 5 0 1 1 4.9-6H22v4h-2v3h-3v-3h-5.1A5 5 0 0 1 7 14zm0-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor" transform="translate(0 3)"/></svg>
      <input id="token-input" type="password" spellcheck="false" placeholder="Paste a bot token anywhere — Ctrl+V">
      <button type="submit">Add bot</button>
    </form>
    <div id="conn" class="conn" title="Connection to local server"></div>
  </header>

  <div class="layout">
    <aside>
      <div class="aside-head">Bots</div>
      <div id="bots"></div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="toasts"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
